services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: antonvasiliuk/profile:latest
    env_file:
      - .env.docker.prod
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    mem_limit: 384m
    mem_reservation: 256m
    cpus: 0.75
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      edge_net:
        aliases:
          - profile-app

volumes:
  app_storage:
  app_cache:

networks:
  edge_net:
    external: true
    name: instiles_default

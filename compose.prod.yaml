services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: antonvasiliuk/profile:latest
    env_file:
      - .env.docker.prod
    expose:
      - "8080"
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_net

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env.docker.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - app_net

volumes:
  app_storage:
  app_cache:
  caddy_data:
  caddy_config:

networks:
  app_net:
